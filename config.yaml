# Hyperparameters Configuration
# This file contains all hyperparameters for your training run.
# The app will automatically track changes to these parameters.

training:
  learning_rate: 0.001
  batch_size: 32
  num_epochs: 100
  optimizer: "adam"
  weight_decay: 0.0001

model:
  architecture: "resnet50"
  pretrained: true
  num_classes: 10
  dropout: 0.5

data:
  train_path: "data/train"
  val_path: "data/val"
  test_path: "data/test"
  image_size: 224
  num_workers: 4
  augmentation: true

logging:
  log_interval: 10
  save_interval: 5
  checkpoint_dir: "checkpoints"
