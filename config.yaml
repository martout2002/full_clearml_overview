# Hyperparameters Configuration for Fashion-MNIST Training
# This file contains all hyperparameters for your training run.
# ClearML will automatically track changes to these parameters.

training:
  batch_size: 64
  learning_rate: 0.01
  num_epochs: 10
  optimizer: "SGD"

model:
  input_size: 784
  hidden_size: 128
  output_size: 10

data:
  normalize_mean: 0.5
  normalize_std: 0.5
  data_dir: "data"
